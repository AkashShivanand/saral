<style>:root { --saral-feedback-danger-text: light-dark(#b42318, #ff8f80); --saral-feedback-danger-subtle: light-dark(#fdecea, #3a1714); --saral-feedback-success-text: light-dark(#1e6b3a, #6fcf8f); --saral-feedback-success-subtle: light-dark(#e7f3ec, #13291b); --saral-feedback-warning-text: light-dark(#7a4b00, #f2c46b); --saral-feedback-warning-subtle: light-dark(#fdf3e1, #2e2410); --saral-feedback-info-text: light-dark(#0b4a50, #8fd0d4); --saral-feedback-info-subtle: light-dark(#e6f0ef, #12302f); --saral-surface-ground: light-dark(#F7F7F7, #000000); --saral-surface-raised: light-dark(#FFFFFF, #0D0D0D); --saral-surface-sunken: light-dark(#EBEBEB, #171717); --saral-text-default: light-dark(#000000, #F7F7F7); --saral-text-muted: light-dark(#474747, #B8B8B8); --saral-text-quiet: light-dark(#525252, #A6A6A6); --saral-border-hairline: light-dark(#CFCFCF, #2E2E2E); --saral-border-strong: light-dark(#000000, #F7F7F7); --saral-action-default: light-dark(#000000, #F7F7F7); --saral-text-on-action: light-dark(#F7F7F7, #000000); --saral-accent-default: light-dark(#000000, #F7F7F7); --saral-border-focus: light-dark(#000000, #00FF00); --saral-accent-subtle: light-dark(#E3E3E3, #1F1F1F); --saral-surface-inverse: light-dark(#000000, #F7F7F7); --saral-text-inverse: light-dark(#F7F7F7, #000000); --saral-text-on-accent: light-dark(#F7F7F7, #000000); --saral-text-disabled: light-dark(#888888, #6f6f6f); --saral-action-hover: light-dark(#000000, #ffffff); --saral-action-pressed: light-dark(#000000, #ffffff); --saral-action-disabled: light-dark(#EBEBEB, #171717); --saral-accent-hover: light-dark(#000000, #ffffff); --saral-feedback-danger-border: light-dark(#b42318, #ff8f80); --saral-feedback-success-border: light-dark(#1e6b3a, #6fcf8f); --saral-feedback-warning-border: light-dark(#7a4b00, #f2c46b); --saral-feedback-info-border: light-dark(#0b4a50, #8fd0d4); --saral-radius-box: 0px; --saral-radius-control: 0px; --saral-font-family-sans: "Noto Sans", "Saral Script", ui-sans-serif, system-ui, sans-serif; --saral-motion-duration-fast: 0ms; --saral-motion-duration-base: 0ms; --d-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;  }  body { background: var(--saral-surface-raised); padding: var(--saral-space-5); }</style>
</head>
<body>
<main>
<form class="demo-form" lang="en" dir="ltr" action="../sent.html" method="get">
  <div data-scope="field" data-part="root">
    <label data-scope="field" data-part="label" for="nj-en-name">Full name</label>
    <input data-scope="field" data-part="input" id="nj-en-name" name="name" autocomplete="name" required aria-describedby="nj-en-name-hint">
    <p data-scope="field" data-part="hint" id="nj-en-name-hint">As it appears on your ID</p>
    <p data-scope="field" data-part="error" id="nj-en-name-error" data-message-value-missing="Enter your full name">Enter your full name</p>
  </div>
  <div data-scope="select" data-part="root">
    <label data-scope="select" data-part="label" for="nj-en-contact">Contact by</label>
    <select data-scope="select" data-part="input" id="nj-en-contact" name="contact" required>
      <option value="">Choose one</option>
      <option value="email">Email</option>
      <option value="phone">Phone</option>
    </select>
    <p data-scope="select" data-part="error" id="nj-en-contact-error" data-message-value-missing="Choose how we should contact you">Choose how we should contact you</p>
  </div>
  <div data-scope="checkbox" data-part="root">
    <input data-scope="checkbox" data-part="input" type="checkbox" id="nj-en-updates" name="updates">
    <label data-scope="checkbox" data-part="label" for="nj-en-updates">Send me updates</label>
  </div>
  <div class="form-actions"><button data-scope="button" data-part="root" data-variant="accent" type="submit">Continue</button></div>
  <p data-scope="notice" data-part="root" data-tone="success" role="status" class="sent" hidden>Sent. Check your inbox.</p>
</form>
</main>
</body>
</html>
