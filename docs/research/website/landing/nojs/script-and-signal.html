<!doctype html>
<html lang="en" class="d-script-and-signal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Saral, Script and Signal: the form with scripts disabled</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap&amp;text=%20!%22%23%24%25%26'()*%2B%2C-.%2F0123456789%3A%3B%3C%3D%3E%3F%40ABCDEFGHIJKLMNOPQRSTUVWXYZ%5B%5C%5D%5E_%60abcdefghijklmnopqrstuvwxyz%7B%7C%7D~%E2%80%99%E2%80%98%E2%80%9C%E2%80%9D%E2%80%A6%C2%B7%E2%80%A2%C3%97%E2%86%92%E2%86%90%E2%86%91%E2%86%93%E2%9C%93">
<link rel="stylesheet" href="../landing.css">
<style>:root { --saral-feedback-danger-text: light-dark(#b42318, #ff8f80); --saral-feedback-danger-subtle: light-dark(#fdecea, #3a1714); --saral-feedback-success-text: light-dark(#1e6b3a, #6fcf8f); --saral-feedback-success-subtle: light-dark(#e7f3ec, #13291b); --saral-feedback-warning-text: light-dark(#7a4b00, #f2c46b); --saral-feedback-warning-subtle: light-dark(#fdf3e1, #2e2410); --saral-feedback-info-text: light-dark(#0b4a50, #8fd0d4); --saral-feedback-info-subtle: light-dark(#e6f0ef, #12302f); --saral-surface-ground: light-dark(#F5F5F0, #0B0F14); --saral-surface-raised: light-dark(#FFFFFF, #121821); --saral-surface-sunken: light-dark(#EBEBE4, #18202B); --saral-text-default: light-dark(#0B0F14, #F5F5F0); --saral-text-muted: light-dark(#4A505A, #A9B0BA); --saral-text-quiet: light-dark(#555B65, #98A0AB); --saral-border-hairline: light-dark(#DEDED6, #232C38); --saral-border-strong: light-dark(#6E737B, #7A838F); --saral-action-default: light-dark(#0B0F14, #F5F5F0); --saral-text-on-action: light-dark(#F5F5F0, #0B0F14); --saral-accent-default: light-dark(#d11c7e, #EC4899); --saral-text-on-accent: light-dark(#FFFFFF, #0B0F14); --saral-border-focus: light-dark(#7C4DEB, #A78BFA); --saral-accent-subtle: light-dark(#FCE7F1, #2E1324); --saral-surface-inverse: light-dark(#0B0F14, #F5F5F0); --saral-text-inverse: light-dark(#F5F5F0, #0B0F14); --saral-text-disabled: light-dark(#8c8e8d, #747677); --saral-action-hover: light-dark(#020407, #ffffff); --saral-action-pressed: light-dark(#000001, #ffffff); --saral-action-disabled: light-dark(#EBEBE4, #18202B); --saral-accent-hover: light-dark(#b8006c, #ff61ab); --saral-feedback-danger-border: light-dark(#b42318, #ff8f80); --saral-feedback-success-border: light-dark(#1e6b3a, #6fcf8f); --saral-feedback-warning-border: light-dark(#7a4b00, #f2c46b); --saral-feedback-info-border: light-dark(#0b4a50, #8fd0d4); --saral-radius-box: 12px; --saral-radius-control: 10px; --saral-font-family-sans: "Manrope", "Saral Script", ui-sans-serif, system-ui, sans-serif; --d-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; --d-cyan: light-dark(#06B6D4, #22D3EE); --d-magenta: light-dark(#EC4899, #F472B6); --d-violet: light-dark(#8B5CF6, #A78BFA); --d-cyan-text: light-dark(#007a8c, #22D3EE); }  body { background: var(--saral-surface-raised); padding: var(--saral-space-5); }</style>
</head>
<body>
<main>
<form class="demo-form" lang="en" dir="ltr" action="../sent.html" method="get">
  <div data-scope="field" data-part="root">
    <label data-scope="field" data-part="label" for="nj-en-name">Full name</label>
    <input data-scope="field" data-part="input" id="nj-en-name" name="name" autocomplete="name" required aria-describedby="nj-en-name-hint">
    <p data-scope="field" data-part="hint" id="nj-en-name-hint">As it appears on your ID</p>
    <p data-scope="field" data-part="error" id="nj-en-name-error" data-message-value-missing="Enter your full name">Enter your full name</p>
  </div>
  <div data-scope="select" data-part="root">
    <label data-scope="select" data-part="label" for="nj-en-contact">Contact by</label>
    <select data-scope="select" data-part="input" id="nj-en-contact" name="contact" required>
      <option value="">Choose one</option>
      <option value="email">Email</option>
      <option value="phone">Phone</option>
    </select>
    <p data-scope="select" data-part="error" id="nj-en-contact-error" data-message-value-missing="Choose how we should contact you">Choose how we should contact you</p>
  </div>
  <div data-scope="checkbox" data-part="root">
    <input data-scope="checkbox" data-part="input" type="checkbox" id="nj-en-updates" name="updates">
    <label data-scope="checkbox" data-part="label" for="nj-en-updates">Send me updates</label>
  </div>
  <div class="form-actions"><button data-scope="button" data-part="root" data-variant="accent" type="submit">Continue</button></div>
  <p data-scope="notice" data-part="root" data-tone="success" role="status" class="sent" hidden>Sent. Check your inbox.</p>
</form>
</main>
</body>
</html>
