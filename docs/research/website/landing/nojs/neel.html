<!doctype html>
<html lang="en" class="d-neel">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Saral, Neel: the form with scripts disabled</title>

<link rel="stylesheet" href="../landing.css">
<style>:root { --saral-feedback-danger-text: light-dark(#b42318, #ff8f80); --saral-feedback-danger-subtle: light-dark(#fdecea, #3a1714); --saral-feedback-success-text: light-dark(#1e6b3a, #6fcf8f); --saral-feedback-success-subtle: light-dark(#e7f3ec, #13291b); --saral-feedback-warning-text: light-dark(#7a4b00, #f2c46b); --saral-feedback-warning-subtle: light-dark(#fdf3e1, #2e2410); --saral-feedback-info-text: light-dark(#0b4a50, #8fd0d4); --saral-feedback-info-subtle: light-dark(#e6f0ef, #12302f); --saral-surface-ground: light-dark(#F6F7FB, #090E1F); --saral-surface-raised: light-dark(#FFFFFF, #11172A); --saral-surface-sunken: light-dark(#E9EBF5, #171E33); --saral-text-default: light-dark(#11163A, #E8EBF2); --saral-text-muted: light-dark(#464C6E, #ABB4CB); --saral-text-quiet: light-dark(#575D7E, #98A1B8); --saral-border-hairline: light-dark(#DCDFEE, #222A42); --saral-border-strong: light-dark(#6A7090, #7D869C); --saral-action-default: light-dark(#0F172D, #93AEF8); --saral-accent-default: light-dark(#3B47C4, #A9B4F6); --saral-accent-subtle: light-dark(#E8EAFB, #232941); --saral-border-focus: light-dark(#3B47C4, #93AEF8); --saral-surface-inverse: light-dark(#11163A, #E8EBF2); --saral-text-inverse: light-dark(#F6F7FB, #090E1F); --saral-text-on-action: light-dark(#ffffff, #090E1F); --saral-text-on-accent: light-dark(#ffffff, #090E1F); --saral-text-disabled: light-dark(#8f92a4, #6d717e); --saral-action-hover: light-dark(#04091e, #abc2ff); --saral-action-pressed: light-dark(#000110, #c7d7ff); --saral-action-disabled: light-dark(#E9EBF5, #171E33); --saral-accent-hover: light-dark(#2e33b0, #bfc9ff); --saral-feedback-danger-border: light-dark(#b42318, #ff8f80); --saral-feedback-success-border: light-dark(#1e6b3a, #6fcf8f); --saral-feedback-warning-border: light-dark(#7a4b00, #f2c46b); --saral-feedback-info-border: light-dark(#0b4a50, #8fd0d4); --saral-radius-box: 8px; --saral-radius-control: 6px; --saral-font-family-sans: "Anek Latin", "Saral Script", ui-sans-serif, system-ui, sans-serif; --d-display: "Saral Eczar", Georgia, serif; --d-band: light-dark(#11163A, #141B3A); --d-band-text: light-dark(#F6F7FB, #E8EBF2); --d-band-tint: light-dark(#C9CEF7, #93AEF8); --d-wash: light-dark(#E6E9FA, #10173A); --d-shadow: light-dark(rgb(17 22 58 / 0.22), rgb(0 0 0 / 0.5)); }  body { background: var(--saral-surface-raised); padding: var(--saral-space-5); }</style>
</head>
<body>
<main>
<form class="demo-form" lang="en" dir="ltr" action="../sent.html" method="get">
  <div data-scope="field" data-part="root">
    <label data-scope="field" data-part="label" for="nj-en-name">Full name</label>
    <input data-scope="field" data-part="input" id="nj-en-name" name="name" autocomplete="name" required aria-describedby="nj-en-name-hint">
    <p data-scope="field" data-part="hint" id="nj-en-name-hint">As it appears on your ID</p>
    <p data-scope="field" data-part="error" id="nj-en-name-error" data-message-value-missing="Enter your full name">Enter your full name</p>
  </div>
  <div data-scope="select" data-part="root">
    <label data-scope="select" data-part="label" for="nj-en-contact">Contact by</label>
    <select data-scope="select" data-part="input" id="nj-en-contact" name="contact" required>
      <option value="">Choose one</option>
      <option value="email">Email</option>
      <option value="phone">Phone</option>
    </select>
    <p data-scope="select" data-part="error" id="nj-en-contact-error" data-message-value-missing="Choose how we should contact you">Choose how we should contact you</p>
  </div>
  <div data-scope="checkbox" data-part="root">
    <input data-scope="checkbox" data-part="input" type="checkbox" id="nj-en-updates" name="updates">
    <label data-scope="checkbox" data-part="label" for="nj-en-updates">Send me updates</label>
  </div>
  <div class="form-actions"><button data-scope="button" data-part="root" data-variant="accent" type="submit">Continue</button></div>
  <p data-scope="notice" data-part="root" data-tone="success" role="status" class="sent" hidden>Sent. Check your inbox.</p>
</form>
</main>
</body>
</html>
