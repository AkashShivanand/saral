<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Saral, Living Material: the form with scripts disabled</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400..700&amp;display=swap&amp;text=%20!%22%23%24%25%26'()*%2B%2C-.%2F0123456789%3A%3B%3C%3D%3E%3F%40ABCDEFGHIJKLMNOPQRSTUVWXYZ%5B%5C%5D%5E_%60abcdefghijklmnopqrstuvwxyz%7B%7C%7D~%E2%80%99%E2%80%98%E2%80%9C%E2%80%9D%E2%80%A6%C2%B7%E2%80%A2%C3%97%E2%86%92%E2%86%90%E2%86%91%E2%86%93%E2%9C%93">

<style>:root { --saral-feedback-danger-text: light-dark(#b42318, #ff8f80); --saral-feedback-danger-subtle: light-dark(#fdecea, #3a1714); --saral-feedback-success-text: light-dark(#1e6b3a, #6fcf8f); --saral-feedback-success-subtle: light-dark(#e7f3ec, #13291b); --saral-feedback-warning-text: light-dark(#7a4b00, #f2c46b); --saral-feedback-warning-subtle: light-dark(#fdf3e1, #2e2410); --saral-feedback-info-text: light-dark(#0b4a50, #8fd0d4); --saral-feedback-info-subtle: light-dark(#e6f0ef, #12302f); --saral-surface-ground: light-dark(#F8F5EF, #131A17); --saral-surface-raised: light-dark(#FFFDF9, #1A231F); --saral-surface-sunken: light-dark(#EFE8DC, #212C27); --saral-text-default: light-dark(#1F2937, #EEE9DF); --saral-text-muted: light-dark(#4B5563, #B9B3A7); --saral-text-quiet: light-dark(#565F6C, #A59F93); --saral-border-hairline: light-dark(#E6D9C6, #2C3832); --saral-border-strong: light-dark(#7A7468, #87918B); --saral-action-default: light-dark(#155E45, #7CC4A4); --saral-accent-default: light-dark(#b15531, #E8A07F); --saral-border-focus: light-dark(#155E45, #7CC4A4); --saral-accent-subtle: light-dark(#F4E6DD, #2E211B); --saral-surface-inverse: light-dark(#1F2937, #EEE9DF); --saral-text-inverse: light-dark(#F8F5EF, #131A17); --saral-text-on-action: light-dark(#ffffff, #131A17); --saral-text-on-accent: light-dark(#ffffff, #131A17); --saral-text-disabled: light-dark(#96999c, #767771); --saral-action-hover: light-dark(#004d36, #8fd7b7); --saral-action-pressed: light-dark(#003b28, #a2ebca); --saral-action-disabled: light-dark(#EFE8DC, #212C27); --saral-accent-hover: light-dark(#9d431e, #fcb391); --saral-feedback-danger-border: light-dark(#b42318, #ff8f80); --saral-feedback-success-border: light-dark(#1e6b3a, #6fcf8f); --saral-feedback-warning-border: light-dark(#7a4b00, #f2c46b); --saral-feedback-info-border: light-dark(#0b4a50, #8fd0d4); --saral-radius-box: 14px; --saral-radius-control: 10px; --saral-font-family-sans: "Source Sans 3", "Saral Script", ui-sans-serif, system-ui, sans-serif; --saral-motion-duration-base: 700ms; --d-limestone: light-dark(#E6D9C6, #2A332E); --d-forest: light-dark(#155E45, #1F4A3A); --d-shadow: light-dark(rgb(60 45 25 / 0.14), rgb(0 0 0 / 0.45)); }  body { background: var(--saral-surface-raised); padding: var(--saral-space-5); }</style>
</head>
<body>
<main>
<form class="demo-form" lang="en" dir="ltr" action="../sent.html" method="get">
  <div data-scope="field" data-part="root">
    <label data-scope="field" data-part="label" for="nj-en-name">Full name</label>
    <input data-scope="field" data-part="input" id="nj-en-name" name="name" autocomplete="name" required aria-describedby="nj-en-name-hint">
    <p data-scope="field" data-part="hint" id="nj-en-name-hint">As it appears on your ID</p>
    <p data-scope="field" data-part="error" id="nj-en-name-error" data-message-value-missing="Enter your full name">Enter your full name</p>
  </div>
  <div data-scope="select" data-part="root">
    <label data-scope="select" data-part="label" for="nj-en-contact">Contact by</label>
    <select data-scope="select" data-part="input" id="nj-en-contact" name="contact" required>
      <option value="">Choose one</option>
      <option value="email">Email</option>
      <option value="phone">Phone</option>
    </select>
    <p data-scope="select" data-part="error" id="nj-en-contact-error" data-message-value-missing="Choose how we should contact you">Choose how we should contact you</p>
  </div>
  <div data-scope="checkbox" data-part="root">
    <input data-scope="checkbox" data-part="input" type="checkbox" id="nj-en-updates" name="updates">
    <label data-scope="checkbox" data-part="label" for="nj-en-updates">Send me updates</label>
  </div>
  <div class="form-actions"><button data-scope="button" data-part="root" data-variant="accent" type="submit">Continue</button></div>
  <p data-scope="notice" data-part="root" data-tone="success" role="status" class="sent" hidden>Sent. Check your inbox.</p>
</form>
</main>
</body>
</html>
