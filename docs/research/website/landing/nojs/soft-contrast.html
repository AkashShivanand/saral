<!doctype html>
<html lang="en" class="d-soft-contrast">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Saral, Soft Contrast: the form with scripts disabled</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:wght@400..800&amp;family=Source+Code+Pro:wght@400..600&amp;display=swap&amp;text=%20!%22%23%24%25%26'()*%2B%2C-.%2F0123456789%3A%3B%3C%3D%3E%3F%40ABCDEFGHIJKLMNOPQRSTUVWXYZ%5B%5C%5D%5E_%60abcdefghijklmnopqrstuvwxyz%7B%7C%7D~%E2%80%99%E2%80%98%E2%80%9C%E2%80%9D%E2%80%A6%C2%B7%E2%80%A2%C3%97%E2%86%92%E2%86%90%E2%86%91%E2%86%93%E2%9C%93">
<link rel="stylesheet" href="../landing.css">
<style>:root { --saral-feedback-danger-text: light-dark(#b42318, #ff8f80); --saral-feedback-danger-subtle: light-dark(#fdecea, #3a1714); --saral-feedback-success-text: light-dark(#1e6b3a, #6fcf8f); --saral-feedback-success-subtle: light-dark(#e7f3ec, #13291b); --saral-feedback-warning-text: light-dark(#7a4b00, #f2c46b); --saral-feedback-warning-subtle: light-dark(#fdf3e1, #2e2410); --saral-feedback-info-text: light-dark(#0b4a50, #8fd0d4); --saral-feedback-info-subtle: light-dark(#e6f0ef, #12302f); --saral-surface-ground: light-dark(#F4EDE4, #13201E); --saral-surface-raised: light-dark(#FFFFFF, #1A2A27); --saral-surface-sunken: light-dark(#EAE1D5, #213330); --saral-text-default: light-dark(#1B3B36, #F4EDE4); --saral-text-muted: light-dark(#4A5A55, #C3BCB1); --saral-text-quiet: light-dark(#52625D, #B1AA9F); --saral-border-hairline: light-dark(#E2D7C8, #2C3F3B); --saral-border-strong: light-dark(#6F7B76, #8E9A95); --saral-action-default: light-dark(#1B3B36, #CFE3DA); --saral-accent-default: light-dark(#ad4e3f, #E59484); --saral-border-focus: light-dark(#ad4e3f, #E59484); --saral-accent-subtle: light-dark(#F8E3DE, #3A2622); --saral-surface-inverse: light-dark(#1B3B36, #F4EDE4); --saral-text-inverse: light-dark(#F4EDE4, #13201E); --saral-text-on-action: light-dark(#ffffff, #13201E); --saral-text-on-accent: light-dark(#ffffff, #13201E); --saral-text-disabled: light-dark(#929d96, #787c77); --saral-action-hover: light-dark(#0a2c27, #e3f7ee); --saral-action-pressed: light-dark(#001d19, #ffffff); --saral-action-disabled: light-dark(#EAE1D5, #213330); --saral-accent-hover: light-dark(#993c2e, #faa796); --saral-feedback-danger-border: light-dark(#b42318, #ff8f80); --saral-feedback-success-border: light-dark(#1e6b3a, #6fcf8f); --saral-feedback-warning-border: light-dark(#7a4b00, #f2c46b); --saral-feedback-info-border: light-dark(#0b4a50, #8fd0d4); --saral-radius-box: 18px; --saral-radius-control: 14px; --saral-font-family-sans: "Mulish", "Saral Script", ui-sans-serif, system-ui, sans-serif; --saral-size-control: 52px; --saral-focus-width: 4px; --saral-font-size-body: 18px; --saral-font-size-small: 16px; --saral-font-size-lead: 20px; --saral-motion-duration-fast: 280ms; --d-mono: "Source Code Pro", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;  }  body { background: var(--saral-surface-raised); padding: var(--saral-space-5); }</style>
</head>
<body>
<main>
<form class="demo-form" lang="en" dir="ltr" action="../sent.html" method="get">
  <div data-scope="field" data-part="root">
    <label data-scope="field" data-part="label" for="nj-en-name">Full name</label>
    <input data-scope="field" data-part="input" id="nj-en-name" name="name" autocomplete="name" required aria-describedby="nj-en-name-hint">
    <p data-scope="field" data-part="hint" id="nj-en-name-hint">As it appears on your ID</p>
    <p data-scope="field" data-part="error" id="nj-en-name-error" data-message-value-missing="Enter your full name">Enter your full name</p>
  </div>
  <div data-scope="select" data-part="root">
    <label data-scope="select" data-part="label" for="nj-en-contact">Contact by</label>
    <select data-scope="select" data-part="input" id="nj-en-contact" name="contact" required>
      <option value="">Choose one</option>
      <option value="email">Email</option>
      <option value="phone">Phone</option>
    </select>
    <p data-scope="select" data-part="error" id="nj-en-contact-error" data-message-value-missing="Choose how we should contact you">Choose how we should contact you</p>
  </div>
  <div data-scope="checkbox" data-part="root">
    <input data-scope="checkbox" data-part="input" type="checkbox" id="nj-en-updates" name="updates">
    <label data-scope="checkbox" data-part="label" for="nj-en-updates">Send me updates</label>
  </div>
  <div class="form-actions"><button data-scope="button" data-part="root" data-variant="accent" type="submit">Continue</button></div>
  <p data-scope="notice" data-part="root" data-tone="success" role="status" class="sent" hidden>Sent. Check your inbox.</p>
</form>
</main>
</body>
</html>
