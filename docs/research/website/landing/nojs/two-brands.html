<!doctype html>
<html lang="en" class="d-two-brands">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Saral, Two brands: the form with scripts disabled</title>

<link rel="stylesheet" href="../landing.css">
<style>:root { --saral-feedback-danger-text: light-dark(#b42318, #ff8f80); --saral-feedback-danger-subtle: light-dark(#fdecea, #3a1714); --saral-feedback-success-text: light-dark(#1e6b3a, #6fcf8f); --saral-feedback-success-subtle: light-dark(#e7f3ec, #13291b); --saral-feedback-warning-text: light-dark(#7a4b00, #f2c46b); --saral-feedback-warning-subtle: light-dark(#fdf3e1, #2e2410); --saral-feedback-info-text: light-dark(#0b4a50, #8fd0d4); --saral-feedback-info-subtle: light-dark(#e6f0ef, #12302f); --saral-surface-ground: light-dark(#FFFFFF, #111111); --saral-surface-raised: light-dark(#FFFFFF, #191919); --saral-surface-sunken: light-dark(#F3F3F3, #222222); --saral-text-default: light-dark(#111111, #F2F2F2); --saral-text-muted: light-dark(#555555, #B3B3B3); --saral-text-quiet: light-dark(#5F5F5F, #A3A3A3); --saral-border-hairline: light-dark(#E3E3E3, #2E2E2E); --saral-border-strong: light-dark(#767676, #676767); --saral-action-default: light-dark(#111111, #F2F2F2); --saral-accent-default: light-dark(#111111, #F2F2F2); --saral-border-focus: light-dark(#111111, #F2F2F2); --saral-accent-subtle: light-dark(#F0F0F0, #262626); --saral-surface-inverse: light-dark(#111111, #F2F2F2); --saral-text-inverse: light-dark(#FFFFFF, #111111); --saral-text-on-action: light-dark(#ffffff, #111111); --saral-text-on-accent: light-dark(#ffffff, #111111); --saral-text-disabled: light-dark(#949494, #767676); --saral-action-hover: light-dark(#050505, #ffffff); --saral-action-pressed: light-dark(#010101, #ffffff); --saral-action-disabled: light-dark(#F3F3F3, #222222); --saral-accent-hover: light-dark(#050505, #ffffff); --saral-feedback-danger-border: light-dark(#b42318, #ff8f80); --saral-feedback-success-border: light-dark(#1e6b3a, #6fcf8f); --saral-feedback-warning-border: light-dark(#7a4b00, #f2c46b); --saral-feedback-info-border: light-dark(#0b4a50, #8fd0d4); --saral-radius-box: 4px; --saral-radius-control: 4px; --saral-font-family-sans: "Anek Latin", "Saral Script", ui-sans-serif, system-ui, sans-serif;  }  body { background: var(--saral-surface-raised); padding: var(--saral-space-5); }</style>
</head>
<body>
<main>
<form class="demo-form" lang="en" dir="ltr" action="../sent.html" method="get">
  <div data-scope="field" data-part="root">
    <label data-scope="field" data-part="label" for="nj-en-name">Full name</label>
    <input data-scope="field" data-part="input" id="nj-en-name" name="name" autocomplete="name" required aria-describedby="nj-en-name-hint">
    <p data-scope="field" data-part="hint" id="nj-en-name-hint">As it appears on your ID</p>
    <p data-scope="field" data-part="error" id="nj-en-name-error" data-message-value-missing="Enter your full name">Enter your full name</p>
  </div>
  <div data-scope="select" data-part="root">
    <label data-scope="select" data-part="label" for="nj-en-contact">Contact by</label>
    <select data-scope="select" data-part="input" id="nj-en-contact" name="contact" required>
      <option value="">Choose one</option>
      <option value="email">Email</option>
      <option value="phone">Phone</option>
    </select>
    <p data-scope="select" data-part="error" id="nj-en-contact-error" data-message-value-missing="Choose how we should contact you">Choose how we should contact you</p>
  </div>
  <div data-scope="checkbox" data-part="root">
    <input data-scope="checkbox" data-part="input" type="checkbox" id="nj-en-updates" name="updates">
    <label data-scope="checkbox" data-part="label" for="nj-en-updates">Send me updates</label>
  </div>
  <div class="form-actions"><button data-scope="button" data-part="root" data-variant="accent" type="submit">Continue</button></div>
  <p data-scope="notice" data-part="root" data-tone="success" role="status" class="sent" hidden>Sent. Check your inbox.</p>
</form>
</main>
</body>
</html>
