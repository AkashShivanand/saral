name: release

# Publishes @saral/tokens, @saral/css, @saral/core and @saral/react when the
# owner pushes a version tag (v0.4.0) on main. npm gets the @saral names with
# provenance, through trusted publishing (no stored token). GitHub Packages
# gets the same files as @<owner>/saral-*. The plan is in
# docs/spec/2026-10-24-packages-and-registries.md.
on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Every check CI runs, plus the consumer check and the registry rehearsal.
  # Nothing is published unless all of it passes.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: The tag matches the package version and is on main
        id: version
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the package version $version." >&2
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME is not on main." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test
      - run: npm run check:dist
      - run: npm run typecheck
      - run: npm run check:types
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run guard
        env:
          SARAL_GUARD_TERMS: ${{ secrets.SARAL_GUARD_TERMS }}
      - run: npm run check:packages
      - run: npm run check:registry

  npm:
    needs: verify
    runs-on: ubuntu-latest
    # The owner can require an approval for this environment in the repo
    # settings. The npm trusted publisher names the same environment.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11.21.0
      - run: npm ci
      - name: Stage the packages
        run: node tools/release/stage.mjs --registry npm --repo "$GITHUB_REPOSITORY" --out "$RUNNER_TEMP/npm"
      # Only for the very first release, while the packages do not exist on
      # npm yet and so cannot have a trusted publisher. Delete the NPM_TOKEN
      # secret once trusted publishing is set up; then this step does nothing
      # and npm uses the workflow's OIDC identity.
      - name: Use the one-time npm token, if it is set
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$RUNNER_TEMP/npmrc"
            echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/npmrc" >> "$GITHUB_ENV"
          fi
      - name: Publish to npm with provenance
        run: node tools/release/publish.mjs --dir "$RUNNER_TEMP/npm"

  github-packages:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Stage the packages under the owner's scope
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          scope=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          node tools/release/stage.mjs --registry github --scope "$scope" --repo "$GITHUB_REPOSITORY" --out "$RUNNER_TEMP/github"
      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" > "$RUNNER_TEMP/npmrc"
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc" node tools/release/publish.mjs --dir "$RUNNER_TEMP/github"

  # jsDelivr and unpkg mirror npm by themselves; this proves they serve the
  # new version.
  cdn:
    needs: [verify, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/release/cdn.mjs "${{ needs.verify.outputs.version }}"
