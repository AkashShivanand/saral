name: guard
on:
  push:
  pull_request:
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: npm run check:dist
      - run: npm run guard
        env:
          SARAL_GUARD_TERMS: ${{ secrets.SARAL_GUARD_TERMS }}
